name: build

on:
  push:
    branches: [main]
  workflow_call: {}

permissions:
  contents: read
  security-events: write

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: enforce test isolation (no prod data dir in tests)
        if: matrix.name == 'linux'
        run: |
          bad=$(grep -RnE 'os\.UserConfigDir|UserHomeDir|Library/Application Support/(prism|Prism)[Cc]onductor|\.config/prismconductor' \
                    --include='*_test.go' tests/ . 2>/dev/null || true)
          if [ -n "$bad" ]; then
            echo "::error::test code references the user's real data dir; use t.TempDir() / PRISMCONDUCTOR_DATA_DIR instead"
            echo "$bad"
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install system deps (linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            build-essential \
            pkg-config \
            xvfb

      - name: install system deps (macos)
        if: matrix.name == 'macos'
        run: brew install pkg-config

      - name: install system deps (windows)
        if: matrix.name == 'windows'
        run: choco install mingw --no-progress -y
        shell: powershell

      - name: install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: install frontend deps
        working-directory: frontend
        run: npm ci

      - name: build frontend
        working-directory: frontend
        run: npm run build

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...
        # includes internal/store migration framework tests and v0-baseline
        # fixture tests (internal/store/migrations_test.go)

      - name: typecheck frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: wails build
        run: wails build
        shell: bash
        env:
          CGO_ENABLED: "1"

      - name: install test deps + chromium (linux)
        if: matrix.name == 'linux'
        working-directory: tests
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: smoke test (linux)
        if: matrix.name == 'linux'
        # Capture playwright's exit code BEFORE the cleanup `pkill ... || true`
        # commands, otherwise the step's exit code is the last command (cleanup,
        # always 0) and a real test failure silently passes CI.
        run: |
          set -m
          export PRISMCONDUCTOR_DATA_DIR="$RUNNER_TEMP/prismconductor-smoke"
          mkdir -p "$PRISMCONDUCTOR_DATA_DIR"
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' \
            wails dev -loglevel error > /tmp/wails-dev.log 2>&1 &
          WAILS_PID=$!
          for i in $(seq 1 240); do
            if curl -fsS -o /dev/null http://localhost:34115; then
              echo "wails dev ready after ${i}s"
              break
            fi
            sleep 1
          done
          set +e
          (cd tests && npx playwright test e2e/startup.spec.ts)
          PW_EXIT=$?
          set -e
          kill "$WAILS_PID" || true
          pkill -9 -f 'wails dev' || true
          pkill -9 Xvfb || true
          exit "$PW_EXIT"
        env:
          CI: "true"

      - name: upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.name }}
          path: build/bin/
          retention-days: 7

  security:
    name: security scan
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install frontend deps
        working-directory: frontend
        run: npm ci

      - name: build frontend
        working-directory: frontend
        run: npm run build

      - name: install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      # gosec runs in two passes:
      #  1. Generate SARIF for the GitHub code-scanning UI (must keep going on
      #     findings so the SARIF upload still happens). This is advisory.
      #  2. Re-run with -severity high to FAIL the job on high-severity
      #     findings only. Anything below high is informational and surfaces
      #     in the Security tab without blocking merges.
      - name: gosec (sarif, advisory)
        run: gosec -no-fail -fmt sarif -out gosec-results.sarif ./...

      - name: upload gosec results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gosec-results.sarif
          category: gosec

      - name: gosec (gating, high severity only)
        run: gosec -severity high ./...

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
