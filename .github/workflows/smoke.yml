name: smoke
permissions:
  contents: read
  issues: write
  pull-requests: write
on:
  push:
    # main is covered by build.yml (full matrix + security); smoke runs on feature branches only
    branches: ["feat/issue-*"]
  pull_request:
    branches: ["main"]

jobs:
  smoke:
    # ubuntu-22.04 ships libwebkit2gtk-4.0-dev in its default apt repos; on
    # 24.04 only 4.1 is available and Wails v2's default build expects 4.0.
    # Pin until upstream Wails fully supports 4.1 in the default profile.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Fetch enough history to diff against the base branch for the
          # frontend-change detection step.
          fetch-depth: 0
      - name: enforce test isolation (no prod data dir in tests)
        run: |
          bad=$(grep -RnE 'os\.UserConfigDir|UserHomeDir|Library/Application Support/(prism|Prism)[Cc]onductor|\.config/prismconductor' \
                    --include='*_test.go' tests/ . 2>/dev/null || true)
          if [ -n "$bad" ]; then
            echo "::error::test code references the user's real data dir; use t.TempDir() / PRISMCONDUCTOR_DATA_DIR instead"
            echo "$bad"
            exit 1
          fi
      - uses: actions/setup-go@v6
        with: { go-version: "1.25" }
      - uses: actions/setup-node@v6
        with: { node-version: "20" }
      # Wails on Linux links against GTK3 + WebKit2GTK at build time AND
      # initializes GTK at runtime to open a desktop window — even in
      # `wails dev` mode. The headless GitHub runner has no X display, so
      # `wails dev` panics with "failed to init GTK" the moment it tries
      # to create the window. xvfb provides a virtual X server so the
      # window-init succeeds and the dev URL stays up for the smoke test.
      #
      # Two-tier install: (1) try the apt-cache action with a 3-min step
      # timeout — happy path is a cache hit in seconds, cache miss with a
      # healthy backend is ~2 min. (2) If the action fails OR times out
      # (GitHub Actions cache service has been seen hanging silently for
      # 15+ min on bad days, e.g. run 25392243837), the fallback step does
      # a plain `apt-get install` directly. Worst-case total ≈ 12 min,
      # which fits the 15-min job budget; happy-case is unchanged.
      - name: install wails system deps (cached)
        id: apt_cache
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        timeout-minutes: 3
        continue-on-error: true
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config xvfb
          version: 1.0
      - name: install wails system deps (fallback, no cache)
        # Runs only if the cached step didn't finish cleanly — usually the
        # GitHub Actions cache backend hanging mid-restore. The 3-min cap
        # above means we wasted at most 3 min before falling through here.
        #
        # The dpkg lock is sometimes held by the runner's background
        # unattended-upgrades process. Stop it before installing and pass
        # DPkg::Lock::Timeout so apt waits up to 60 s instead of dying.
        if: steps.apt_cache.outcome != 'success'
        run: |
          echo "::warning::apt-cache step did not succeed (outcome=${{ steps.apt_cache.outcome }}); falling back to plain apt-get install"
          sudo systemctl stop unattended-upgrades || true
          sudo killall apt-get || true
          sudo apt-get -o DPkg::Lock::Timeout=60 update
          sudo apt-get -o DPkg::Lock::Timeout=60 install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            build-essential \
            pkg-config \
            xvfb
      - name: install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: install frontend deps
        working-directory: frontend
        run: npm ci
      # Note: npm audit lives in build.yml's security job (audit-level=high)
      # so it gates main but doesn't block PRs on transitive moderate dev-only
      # vulns from vite/esbuild that never ship to users.
      - name: install test deps + chromium
        working-directory: tests
        run: |
          npm ci
          npx playwright install chromium --with-deps
      - name: start wails dev
        # Run wails dev under xvfb-run in the background. We manage the
        # process here instead of letting Playwright's webServer block
        # handle it — Playwright's cleanup doesn't reliably traverse the
        # xvfb-run process tree to kill the inner wails process, and the
        # job hangs until the 15-minute job timeout fires.
        #
        # We pre-populate the data dir with the committed fixture DB so
        # that both the smoke spec (startup) and the visual spec (screenshots)
        # run against known, deterministic state. The startup spec doesn't
        # inspect DB content, so booting with the fixture is safe.
        run: |
          set -m
          export PRISMCONDUCTOR_DATA_DIR="$RUNNER_TEMP/prismconductor-smoke"
          mkdir -p "$PRISMCONDUCTOR_DATA_DIR"
          cp tests/fixtures/seed.db "$PRISMCONDUCTOR_DATA_DIR/conductor.db"
          cp tests/fixtures/workspaces.json "$PRISMCONDUCTOR_DATA_DIR/workspaces.json"
          echo "PRISMCONDUCTOR_DATA_DIR=$PRISMCONDUCTOR_DATA_DIR" >> "$GITHUB_ENV"
          xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' \
            wails dev -loglevel error > /tmp/wails-dev.log 2>&1 &
          echo "WAILS_PID=$!" >> "$GITHUB_ENV"
          # Wait for the dev server to come up. Cap at 4 minutes — first
          # build pulls deps + compiles cgo + bundles the frontend.
          for i in $(seq 1 240); do
            if curl -fsS -o /dev/null http://localhost:34115; then
              echo "wails dev ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "wails dev did not come up in 240s; tail of log:"
          tail -100 /tmp/wails-dev.log
          exit 1
      - name: smoke
        working-directory: tests
        run: npx playwright test e2e/startup.spec.ts
        env:
          CI: "true"
      # ── Visual captures (PR-only, gated on frontend/src/ changes) ──────────
      - name: detect frontend changes
        id: frontend_diff
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only \
            "origin/${{ github.base_ref }}...HEAD" -- 'frontend/src/**' 2>/dev/null \
            | head -1)
          if [ -n "$changed" ]; then
            echo "changed=true"  >> "$GITHUB_OUTPUT"
            echo "Frontend changes detected — visual captures will run."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No frontend/src/ changes — skipping visual captures."
          fi
      - name: visual captures
        id: visual
        if: |
          github.event_name == 'pull_request' &&
          steps.frontend_diff.outputs.changed == 'true'
        working-directory: tests
        run: |
          mkdir -p screenshots
          npx playwright test e2e/visual.spec.ts
        env:
          CI: "true"
      - name: upload screenshots
        if: |
          github.event_name == 'pull_request' &&
          steps.frontend_diff.outputs.changed == 'true' &&
          (success() || steps.visual.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots-${{ github.run_id }}
          path: tests/screenshots/
          retention-days: 30
      - name: post PR comment with screenshot links
        if: |
          github.event_name == 'pull_request' &&
          steps.frontend_diff.outputs.changed == 'true' &&
          steps.visual.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const runId = context.runId;
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const runUrl = `${repoUrl}/actions/runs/${runId}`;
            const shots = [
              'board-all-workspaces.png',
              'board-empty.png',
              'board-populated.png',
              'plan-modal.png',
              'settings-workspaces.png',
              'session-drawer.png',
            ];
            const list = shots.map(s => `- \`${s}\``).join('\n');
            const body = [
              '## UI Screenshots',
              '',
              `Visual smoke captures from CI run [#${runId}](${runUrl}).`,
              `Download the \`ui-screenshots-${runId}\` artifact to view them.`,
              '',
              list,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      # ── Cleanup ─────────────────────────────────────────────────────────────
      - name: stop wails dev
        if: always()
        run: |
          # Kill the wails dev background process and any lingering
          # Xvfb / wails children. `|| true` because steps with no
          # matching processes shouldn't fail the job.
          pkill -9 -f 'wails dev' || true
          pkill -9 Xvfb || true
      - name: upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace
          path: test-results/
